<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRACXO</title>
<style>
:root{--green:#63b875;--ink:#1c2623;--paper:#f7faf6}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--paper);color:var(--ink)}.screen{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px}.splash{position:fixed;inset:0;background:var(--paper);z-index:3;transition:opacity .4s ease}.splash.hide{opacity:0;pointer-events:none}.scene{position:relative;width:min(92vw,520px);height:175px}.logo{position:absolute;left:4%;top:46%;transform:translateY(-50%);display:flex;align-items:center;gap:13px;font-weight:900;font-size:clamp(29px,7vw,52px);letter-spacing:2px;white-space:nowrap}.compass{width:55px;height:55px;flex:none;opacity:0;animation:reveal .3s forwards .35s}.compass svg{width:100%;height:100%}.letters{display:flex}.letters span{display:inline-block;opacity:0;transform:translateX(-7px)}.letters span:nth-child(1){animation:reveal .23s forwards .65s}.letters span:nth-child(2){animation:reveal .23s forwards .92s}.letters span:nth-child(3){animation:reveal .23s forwards 1.19s}.letters span:nth-child(4){animation:reveal .23s forwards 1.46s}.letters span:nth-child(5){animation:reveal .23s forwards 1.73s}.letters span:nth-child(6){animation:reveal .23s forwards 2s}.letters span:nth-child(4){color:var(--green)}@keyframes reveal{to{opacity:1;transform:translateX(0)}}.runner{position:absolute;left:0;top:2px;width:48px;height:78px;animation:travel 2.45s linear forwards;z-index:2}.runner svg{overflow:visible;width:48px;height:78px}.runner .arm1,.runner .leg1{transform-origin:24px 37px;animation:stride .34s ease-in-out infinite alternate}.runner .arm2,.runner .leg2{transform-origin:24px 37px;animation:stride .34s ease-in-out infinite alternate-reverse}@keyframes stride{from{transform:rotate(-28deg)}to{transform:rotate(30deg)}}@keyframes travel{from{left:0}to{left:calc(100% - 40px)}}.welcome{max-width:420px;width:100%;text-align:center}.brand{display:flex;align-items:center;justify-content:center;gap:12px;font-size:36px;font-weight:900;letter-spacing:2px}.brand svg{width:43px;height:43px}.brand .x{color:var(--green)}h1{font-size:32px;margin:35px 0 12px}p{line-height:1.55;color:#5d6b63}.language{display:flex;align-items:center;justify-content:flex-end;margin-bottom:70px}.language select{background:white;border:1px solid #d4ded4;border-radius:12px;padding:10px;color:var(--ink);font-size:15px}.actions{display:grid;gap:12px;margin-top:48px}button{padding:16px;border-radius:14px;border:1px solid var(--ink);font-weight:700;font-size:16px;cursor:pointer;background:white;color:var(--ink)}button.primary{background:var(--green);border-color:var(--green);color:#102319}.notice{min-height:25px;margin-top:16px;font-size:14px;color:#4b6954}@media(prefers-reduced-motion:reduce){.runner,.runner *,.letters span,.compass{animation-duration:.01ms!important;animation-delay:0ms!important}}
</style>
</head>
<body>
<div class="screen splash" id="splash" aria-label="TRACXO wordt geladen"><div class="scene"><div class="logo"><div class="compass"><svg viewBox="0 0 60 60" fill="none" stroke="#1c2623" stroke-width="3"><circle cx="30" cy="30" r="24"/><path d="M30 7v8M30 45v8M7 30h8M45 30h8"/><path d="M37 23L25 26 22 39 34 34Z" fill="#63b875" stroke="#1c2623" stroke-width="2"/></svg></div><div class="letters"><span>T</span><span>R</span><span>A</span><span>C</span><span>X</span><span>O</span></div></div><div class="runner" aria-hidden="true"><svg viewBox="0 0 48 78" fill="none" stroke="#1c2623" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="26" cy="12" r="7" fill="#1c2623"/><path d="M25 22L24 39"/><path class="arm1" d="M24 28L10 40"/><path class="arm2" d="M24 28L39 35"/><path class="leg1" d="M24 39L10 57L6 62"/><path class="leg2" d="M24 39L37 53L43 56"/></svg></div></div></div>
<main class="screen"><div class="welcome"><div class="language"><label for="lang" style="margin-right:10px" id="languageLabel">Taal</label><select id="lang"><option value="nl">Nederlands</option><option value="en">English</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="es">Español</option><option value="it">Italiano</option></select></div><div class="brand"><svg viewBox="0 0 60 60" fill="none" stroke="#1c2623" stroke-width="3"><circle cx="30" cy="30" r="24"/><path d="M30 7v8M30 45v8M7 30h8M45 30h8"/><path d="M37 23L25 26 22 39 34 34Z" fill="#63b875" stroke="#1c2623" stroke-width="2"/></svg><span>TRAC<span class="x">X</span>O</span></div><h1 id="heading">Jouw avontuur begint hier</h1><p id="description">Ontdek je omgeving met verrassende wandel-speurtochten, hints en uitdagingen.</p><div class="actions"><button class="primary" id="register">Account aanmaken</button><button id="login">Inloggen</button></div><div class="notice" id="notice" aria-live="polite"></div></div></main>
<script>
const translations={nl:['Taal','Jouw avontuur begint hier','Ontdek je omgeving met verrassende wandel-speurtochten, hints en uitdagingen.','Account aanmaken','Inloggen','Dit scherm bouwen we als volgende.'],en:['Language','Your adventure starts here','Explore your surroundings with walking quests, clues and challenges.','Create account','Log in','We will build this screen next.'],de:['Sprache','Dein Abenteuer beginnt hier','Entdecke deine Umgebung mit Spazier-Quests, Hinweisen und Herausforderungen.','Konto erstellen','Anmelden','Diesen Bildschirm bauen wir als Nächstes.'],fr:['Langue','Votre aventure commence ici','Explorez les environs avec des quêtes à pied, des indices et des défis.','Créer un compte','Connexion','Nous construirons cet écran ensuite.'],es:['Idioma','Tu aventura empieza aquí','Explora tu entorno con aventuras a pie, pistas y desafíos.','Crear cuenta','Iniciar sesión','Crearemos esta pantalla después.'],it:['Lingua','La tua avventura inizia qui','Esplora i dintorni con avventure a piedi, indizi e sfide.','Crea account','Accedi','Realizzeremo questa schermata in seguito.']};
const select=document.getElementById('lang');const detected=(navigator.language||'nl').slice(0,2);select.value=translations[detected]?detected:'en';function update(){const t=translations[select.value];['languageLabel','heading','description','register','login'].forEach((id,i)=>document.getElementById(id).textContent=t[i]);document.getElementById('notice').textContent='';document.documentElement.lang=select.value}select.addEventListener('change',update);update();['register','login'].forEach(id=>document.getElementById(id).addEventListener('click',()=>document.getElementById('notice').textContent=translations[select.value][5]));setTimeout(()=>{const splash=document.getElementById('splash');splash.classList.add('hide');setTimeout(()=>splash.remove(),450)},3000);
</script>
</body></html>
